name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Dev-Jahn/khala-network
          ref: ee7845c4b4e6df156f2d0791b248fce2a90f829c
          path: .test-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          KHALA_TEST_BIN: ${{ github.workspace }}/.test-upstream/bin/khala
      - run: python .test-upstream/test/mailbox-compat.py
      - run: cmp .test-upstream/bin/khala .test-upstream/plugin/bin/khala
