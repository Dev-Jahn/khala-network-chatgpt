[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "khala-network-chatgpt"
version = "0.1.0"
description = "Authenticated MCP mailboxes for an existing Khala network"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29.1,<2", "PyJWT[crypto]>=2.10.1,<3", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
khala-chatgpt = "khala_chatgpt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
